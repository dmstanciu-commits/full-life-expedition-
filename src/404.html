<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Full Life Expedition</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/svg+xml" href="assets/img/mark.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0}
    body{
      min-height:100vh; display:grid; place-items:center; text-align:center;
      font-family:"Inter",sans-serif; color:#3A2E22; padding:2rem;
      background-color:#F7F1E7;
      background-image:radial-gradient(800px 480px at 80% -10%, rgba(235,207,148,0.45), transparent 60%),radial-gradient(600px 400px at 0% 110%, rgba(157,169,139,0.22), transparent 60%);
    }
    .mk{width:40px;height:auto;margin:0 auto 1.6rem;display:block}
    .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:#9B7A38;margin-bottom:1rem}
    h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(2.4rem,6vw,4rem);line-height:1.05;color:#1A1714;margin-bottom:1rem}
    h1 em{font-style:italic;color:#6E7A55}
    p{color:#6B5743;max-width:48ch;margin:0 auto 2rem;font-size:1.05rem;line-height:1.6}
    .btn{display:inline-flex;align-items:center;gap:.5em;background:linear-gradient(135deg,#C6A45D,#B08A3C);color:#1A1714;font-weight:500;padding:.85em 1.5em;border-radius:4px;text-decoration:none;box-shadow:0 10px 28px -12px rgba(198,164,93,0.7);transition:transform .3s}
    .btn:hover{transform:translateY(-2px)}
  </style>
</head>
<body>
  <main>
    <img class="mk" src="assets/img/mark.svg" alt="Full Life Expedition" />
    <p class="eyebrow">Error 404</p>
    <h1>This path leads <em>off the map</em>.</h1>
    <p>The page you're looking for isn't here, it may have moved, or never existed. Let's get you back to the journal.</p>
    <a class="btn" href="/">Return home →</a>
  </main>
</body>
</html>
